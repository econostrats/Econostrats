<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #1f2937);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    .card {
      background: #111827;
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      background: linear-gradient(90deg, #4ade80, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      border: none;
      background: #1f2937;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #4ade80, #60a5fa, #a855f7);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }

    .google-btn {
      background: #1f2937;
      margin-top: 15px;
      border: 1px solid #374151;
    }

    .google-btn:hover {
      background: #374151;
    }

    #error {
      margin-top: 10px;
      font-size: 13px;
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome Back</h2>
    
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="signupBtn">Create Account</button>
    <button class="google-btn" id="googleBtn">Continue with Google</button>

    <p id="error"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfgiRa-J48wktEE6Tg4YrcqPTg-1ztTpk",
      authDomain: "econostrats-5a73a.firebaseapp.com",
      projectId: "econostrats-5a73a",
      storageBucket: "econostrats-5a73a.firebasestorage.app",
      messagingSenderId: "766599325060",
      appId: "1:766599325060:web:fe589fe5fc7c60c09229d1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorText = document.getElementById("error");

    document.getElementById("loginBtn").onclick = () => {
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => window.location.href = "dashboard.html")
        .catch(err => errorText.textContent = err.message);
    };

    document.getElementById("signupBtn").onclick = () => {
      createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => window.location.href = "dashboard.html")
        .catch(err => errorText.textContent = err.message);
    };

    document.getElementById("googleBtn").onclick = () => {
      signInWithPopup(auth, provider)
        .then(() => window.location.href = "dashboard.html")
        .catch(err => errorText.textContent = err.message);
    };
  </script>
</body>
</html>
