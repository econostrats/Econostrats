<!DOCTYPE html>
<html>
<head>
  <title>Trade Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0a0f2c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    input, button {
      padding: 12px;
      margin: 6px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    input {
      width: 250px;
    }

    button {
      background: linear-gradient(135deg, #3a2eff, #00ffaa);
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    .card {
      background: #131942;
      border-radius: 15px;
      padding: 15px;
      margin: 10px auto;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 15px rgba(0,0,0,.5);
    }

    .offer {
      border: 1px solid #00ffaa;
      padding: 10px;
      border-radius: 10px;
      margin: 8px;
    }

    #market { display: none; }
  </style>
</head>
<body>

<h1>⚡ Trade Market</h1>

<!-- LOGIN -->
<div id="login" class="card">
  <h3>Login / Signup</h3>
  <input id="email" placeholder="Email"><br>
  <input id="username" placeholder="Username"><br>
  <input id="userid" placeholder="User ID (make one)"><br>
  <button onclick="login()">Login / Create</button>
  <p id="loginStatus"></p>
</div>

<!-- MARKET -->
<div id="market">

  <div class="card">
    <h3>Welcome, <span id="userName"></span></h3>
    <p>Balance: <b id="userBalance">0</b></p>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h3>Create Offer</h3>
    <input id="item" placeholder="Item name">
    <input id="price" type="number" placeholder="Price">
    <button onclick="createOffer()">Post Offer</button>
  </div>

  <div class="card">
    <h3>Market Offers</h3>
    <div id="offers"></div>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzd6n8gRLEOZX8X7j3oNGw_ZRgd5IHzYjIQuTUC9ZXvswSaADntZbYJ7WTFhDQzbLHELA/exec";

let currentUser = null;

function login() {
  const email = document.getElementById("email").value;
  const username = document.getElementById("username").value;
  const userId = document.getElementById("userid").value;

  if (!email || !username || !userId) {
    alert("Fill in all fields");
    return;
  }

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "createUser",
      email,
      username,
      userId
    })
  }).then(() => loadUser(userId));
}

function loadUser(userId) {
  fetch(API_URL + "?action=getUser&userId=" + userId)
    .then(res => res.json())
    .then(user => {
      if (user.error) {
        document.getElementById("loginStatus").innerText = "User not found";
        return;
      }

      currentUser = user;

      document.getElementById("login").style.display = "none";
      document.getElementById("market").style.display = "block";

      document.getElementById("userName").innerText = user.username;
      document.getElementById("userBalance").innerText = user.value;

      loadOffers();
    });
}

function loadOffers() {
  fetch(API_URL + "?action=getOffers")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("offers");
      container.innerHTML = "";

      data.forEach(o => {
        const div = document.createElement("div");
        div.className = "offer";

        div.innerHTML = `
          <p><b>${o.item}</b></p>
          <p>Price: ${o.price}</p>
          <p>Seller: ${o.sellerUsername}</p>
          <button onclick="acceptOffer('${o.offerId}')">Accept</button>
        `;

        container.appendChild(div);
      });
    });
}

function createOffer() {
  const item = document.getElementById("item").value;
  const price = parseInt(document.getElementById("price").value);

  if (!item || !price) {
    alert("Missing fields");
    return;
  }

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "createOffer",
      item,
      price,
      sellerId: currentUser.userId,
      sellerUsername: currentUser.username
    })
  }).then(() => loadOffers());
}

function acceptOffer(offerId) {
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "acceptOffer",
      offerId,
      buyerId: currentUser.userId
    })
  })
  .then(res => res.json())
  .then(resp => {
    alert(JSON.stringify(resp));
    loadUser(currentUser.userId);
  });
}

function logout() {
  location.reload();
}
</script>

</body>
</html>
