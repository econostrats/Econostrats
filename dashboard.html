<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    .panel {
      background: #111827;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    h1 {
      background: linear-gradient(90deg, #60a5fa, #22c55e, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #username {
      margin: 20px 0;
      font-size: 18px;
      color: #e2e8f0;
    }

    button {
      padding: 12px 20px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(90deg, #4ade80, #60a5fa, #a855f7);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Dashboard</h1>
    <p id="username">Loading...</p>
    <button id="logoutBtn">Logout</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfgiRa-J48wktEE6Tg4YrcqPTg-1ztTpk",
      authDomain: "econostrats-5a73a.firebaseapp.com",
      projectId: "econostrats-5a73a",
      storageBucket: "econostrats-5a73a.firebasestorage.app",
      messagingSenderId: "766599325060",
      appId: "1:766599325060:web:fe589fe5fc7c60c09229d1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const usernameText = document.getElementById("username");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        usernameText.textContent = user.displayName 
          ? `Welcome, ${user.displayName}` 
          : `Welcome, ${user.email}`;
      } else {
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").onclick = () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };
  </script>
</body>
</html>
