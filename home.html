<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Home</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js"></script>

  <style>
    body { 
      font-family: sans-serif; 
      max-width: 480px; 
      margin: 40px auto; 
      text-align: center;
    }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Home</h2>
  <p id="status">Checking login…</p>

  <button onclick="logout()">Log Out</button>

<script>
  // FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyDfgiRa-J48wktEE6Tg4YrcqPTg-1ztTpk",
    authDomain: "econostrats-5a73a.firebaseapp.com",
    projectId: "econostrats-5a73a",
    storageBucket: "econostrats-5a73a.firebasestorage.app",
    messagingSenderId: "766599325060",
    appId: "1:766599325060:web:fe589fe5fc7c60c09229d1",
    measurementId: "G-0CLV0PR5V2"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // If not logged in → redirect
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "index.html";
    } else {
      document.getElementById("status").innerText =
        "Logged in as " + user.email;
    }
  });

  function logout() {
    auth.signOut();
  }
</script>

</body>
</html>
